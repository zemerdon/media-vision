name: Temporary Media Vision Container Publish
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download proven v1.0.0 image
        run: curl -fL --retry 3 -o media-vision-image-1.0.0.tar.gz https://github.com/zemerdon/media-vision/releases/download/v1.0.0/media-vision-image-1.0.0.tar.gz
      - name: Load exact proven image
        run: docker load -i media-vision-image-1.0.0.tar.gz
      - name: Publish public pre-release container
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag ghcr.io/zemerdon/media-vision:1.0.0 ghcr.io/zemerdon/media-vision:prerelease
          docker push ghcr.io/zemerdon/media-vision:1.0.0
          docker push ghcr.io/zemerdon/media-vision:prerelease
